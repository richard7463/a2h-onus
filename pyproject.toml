[project]
name = "a2h-onus"
version = "0.1.0"
description = "ai2human Onus — open verification layer for AI agents: evidence grades, deterministic checks, pluggable System One judge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
mcp = ["fastmcp>=0.2"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/richard7463/a2h-onus"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["a2h_onus*"]

[tool.setuptools.package-data]
"a2h_onus.verify" = ["policy_packs/*.json"]
